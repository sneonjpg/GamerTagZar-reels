name: Test YouTube access

# Tries several free ways to reach a YouTube video from GitHub's computers and reports which work.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "YouTube link to test"
        default: "https://www.youtube.com/watch?v=xFcI47X15Lo"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      pot:
        image: brainicism/bgutil-ytdlp-pot-provider
        ports: ["4416:4416"]
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: pip install -q -U "yt-dlp[default]" bgutil-ytdlp-pot-provider
      - name: Mirrors (Twitch and Kick)
        run: |
          set +e
          for u in twitch.tv/dylanpage twitch.tv/dylan_page twitch.tv/dylanpagelive twitch.tv/kreekcraft twitch.tv/tomo twitch.tv/tomodachi \
                   kick.com/dylanpage kick.com/kreekcraft kick.com/tomo; do
            out=$(timeout 40 python -m yt_dlp --no-warnings -g -f b "https://$u" 2>&1)
            if echo "$out" | grep -q '^https://'; then echo "MIRROR $u: LIVE NOW"; else echo "MIRROR $u: $(echo "$out" | grep -m1 ERROR | cut -c1-120)"; fi
          done
      - name: Probe
        env: { URL: "${{ inputs.url }}" }
        run: |
          set +e
          try() {
            label="$1"; shift
            out=$(timeout 90 python -m yt_dlp --no-warnings -g -f "b[height<=720]/bv*[height<=720]+ba/b" "$@" "$URL" 2>&1)
            if echo "$out" | grep -q '^https://'; then echo "RESULT $label: WORKS"; else echo "RESULT $label: FAILED: $(echo "$out" | grep -m1 ERROR | cut -c1-160)"; fi
          }
          try "plain, no token helper" --extractor-args "youtubepot-bgutilhttp:base_url=http://127.0.0.1:1"
          try "token helper (default clients)"
          try "token helper + tv client" --extractor-args "youtube:player_client=tv"
          try "token helper + mweb client" --extractor-args "youtube:player_client=mweb"
          try "token helper + web_safari client" --extractor-args "youtube:player_client=web_safari"
          try "tv_simply client" --extractor-args "youtube:player_client=tv_simply"
          try "web_embedded client" --extractor-args "youtube:player_client=web_embedded"
