name: Auto clips (every 2 hours)

# Every 2 hours: check which campaign streamers in page/streamers.csv are live on Twitch,
# record each live one, cut clips with captions and save them to page/media/edits/.
# Nothing is posted. Edit page/streamers.csv to add or remove streamers.

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutes to record per live streamer"
        default: "15"

permissions:
  contents: write

concurrency:
  group: make-clips
  cancel-in-progress: false

jobs:
  auto:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: clip-desk/requirements.txt

      - name: Install ffmpeg and Python packages
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
          pip install -q -r clip-desk/requirements.txt

      - name: Cache the caption model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      - name: Record live streamers and cut clips
        working-directory: page
        env:
          MINUTES: ${{ inputs.minutes || '15' }}
        run: |
          python - <<'EOF'
          import csv, os, subprocess, sys, datetime
          rows = list(csv.DictReader(open("streamers.csv", encoding="utf-8")))
          stamp = datetime.datetime.utcnow().strftime("%Y-%m-%d-%H%M")
          made = 0
          for r in rows:
              live = subprocess.run([sys.executable, "-m", "yt_dlp", "--no-warnings", "-g", "-f", "b", r["url"]],
                                    capture_output=True, text=True, timeout=60)
              if not live.stdout.strip().startswith("https://"):
                  print(f"{r['name']}: not live"); continue
              slug = r["name"].lower().replace(" ", "")
              out = f"media/edits/{stamp}-{slug}"
              print(f"{r['name']}: LIVE, recording {os.environ['MINUTES']} min -> {out}", flush=True)
              rc = subprocess.run([sys.executable, "../clip-desk/scripts/auto.py", r["url"], "--mode", "live",
                                   "--minutes", os.environ["MINUTES"], "--top", "3", "--layout", "blur",
                                   "--name", r["name"], "--tag", r["tag"], "--out", out]).returncode
              made += rc == 0
          print(f"done: clips made for {made} streamer(s)")
          EOF

      - name: Save clips to the repo
        if: always()
        run: |
          git config user.name "gamertagzar-clip-desk"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f page/media/edits || true
          git commit -m "Auto clips $(date -u +%Y-%m-%d\ %H:%M)" || exit 0
          git pull --rebase -q || true
          git push
